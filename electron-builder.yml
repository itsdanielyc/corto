# L7 bundles. Unsigned: no certificate on any OS, and no notarization on
# macOS (CI sets CSC_IDENTITY_AUTO_DISCOVERY=false). Output lands in release/.
appId: com.miille.corto
productName: Corto
directories:
  output: release
  buildResources: build
files:
  - out/**
  - "!out/renderer/codecs/ffmpeg/**"
  - package.json
asar: true
fileAssociations:
  - ext: corto
    name: Corto project
    role: Editor
    mimeType: application/x-corto
extraResources:
  - from: node_modules/ffmpeg-static
    to: ffmpeg
    filter: ["ffmpeg*", "LICENSE", "README.md"]
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE-Corto.txt
  - from: scripts/ffmpeg-binaries.json
    to: ffmpeg/SHA256-provenance.json
# No spaces in file names: the installer scripts and CI globs stay simple.
artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: brand/corto-brand-assets/icons/windows/corto.ico
  target: nsis
nsis:
  # Per-user, no prompts: installs to %LOCALAPPDATA%\Programs\<productName>.
  oneClick: true
  perMachine: false
  runAfterFinish: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
mac:
  icon: brand/corto-brand-assets/icons/macos/Corto.icns
  target: dmg
  category: public.app-category.video
  extendInfo:
    NSMicrophoneUsageDescription: Record narration for your films on this device.
    NSCameraUsageDescription: Record camera clips for your films on this device.
dmg:
  writeUpdateInfo: false
linux:
  icon: brand/corto-brand-assets/logo/png/corto-icon-dark-512px.png
  target: [deb, AppImage]
  category: AudioVideo
  executableName: corto
publish: null
