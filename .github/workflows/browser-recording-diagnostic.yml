name: browser-recording-diagnostic
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full commit SHA or branch containing the implementation
        required: true
        default: main
      repetitions:
        type: choice
        options: ["30", "20"]
        default: "30"
      suite:
        type: choice
        options: ["recording", "recovery", "settings", "drafts"]
        default: "recording"
permissions:
  contents: read
# Model inference uses the browser runtime; do not download optional Node CUDA libraries.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  diagnose:
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Repeat the selected browser journey
        run: |
          case "$SUITE" in
            recording) spec=export; pattern='automatic' ;;
            recovery) spec=essentials; pattern='multiple films resume' ;;
            settings) spec=localization; pattern='Spanish settings' ;;
            drafts) spec=concurrent-edits; pattern='while it saves' ;;
            *) exit 2 ;;
          esac
          npx playwright test "tests/ui/$spec.spec.ts" --grep "$pattern" --repeat-each="$REPETITIONS" --workers=2
        env:
          SUITE: ${{ inputs.suite }}
          REPETITIONS: ${{ inputs.repetitions }}
          CI: "1"
          CORTO_RECORDING_DIAGNOSTIC: "1"
          CORTO_RECOVERY_DIAGNOSTIC: "1"
          CORTO_LOCALIZATION_DIAGNOSTIC: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-recording-diagnostic
          path: |
            playwright-report
            test-results
