name: browser-recording-diagnostic
on:
  workflow_dispatch:
    inputs:
      source:
        description: Commit containing the recording implementation
        required: true
        default: 10d473d
      repetitions:
        type: choice
        options: ["30", "20"]
        default: "30"
      suite:
        type: choice
        options: ["recording", "recovery"]
        default: "recording"
permissions:
  contents: read
jobs:
  diagnose:
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/${{ inputs.suite == 'recovery' && 'essentials' || 'export' }}.spec.ts --grep "${{ inputs.suite == 'recovery' && 'multiple films resume' || 'automatic' }}" --repeat-each=${{ inputs.repetitions }} --workers=2
        env:
          CI: "1"
          CORTO_RECORDING_DIAGNOSTIC: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-recording-diagnostic
          path: |
            playwright-report
            test-results
