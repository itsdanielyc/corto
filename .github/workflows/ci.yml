# Main workflow, in tiers of cost:
#   unit  (1 Linux job)       L0-L2: type-check every tsconfig, Vitest,
#                             mock-vs-contract conformance.
#   ui    (3 OS runners)      L4/L5: Playwright on chromium against the Vite dev
#                             server and the labelled mock; ARIA, layout
#                             geometry and per-OS pixel snapshots.
#   e2e   (6 OS runners)      L6: the built app launched by Playwright's
#                             Electron support; a screenshot named after the
#                             OS and CPU the main process reported.
#   sheet (1 Linux job)       Collects every screenshot into one HTML contact
#                             sheet so a developer on one OS can see all of them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress_codecs:
        description: Repeat the browser fallback codec journey 30 times
        type: boolean
        default: false
      native_export_repetitions:
        description: Intel native export diagnostic repetitions (0 runs normal CI)
        type: choice
        options: ["0", "30", "20"]
        default: "0"

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.native_export_repetitions || '0' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    if: ${{ !inputs.native_export_repetitions || inputs.native_export_repetitions == '0' }}
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check renderer, main process and suites
        run: npm run typecheck
      - run: npm run test:unit

  web:
    if: ${{ !inputs.native_export_repetitions || inputs.native_export_repetitions == '0' }}
    name: production web / offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: production-web-failure
          path: test-results
          retention-days: 7

  integration:
    if: ${{ !inputs.native_export_repetitions || inputs.native_export_repetitions == '0' }}
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  ui:
    if: ${{ !inputs.native_export_repetitions || inputs.native_export_repetitions == '0' }}
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Playwright browser
        # Ubuntu's apt can stall on a service-restart prompt during
        # --with-deps; keep it non-interactive and bound each attempt.
        timeout-minutes: 12
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          bound=""; command -v timeout >/dev/null && bound="timeout 420"   # macOS has no timeout(1)
          for attempt in 1 2; do
            $bound npx playwright install --with-deps chromium && exit 0
            echo "attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Playwright (chromium, against the mock)
        env:
          CI: "1"
        run: npm run test:ui
      - name: Upload report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Repeated browser codec validation
        if: inputs.stress_codecs && !cancelled()
        env:
          CI: "1"
        run: npx playwright test tests/ui/export.spec.ts --grep 'automatic' --repeat-each=30
      - uses: actions/upload-artifact@v7
        if: inputs.stress_codecs && failure()
        with:
          name: codec-stress-${{ matrix.os }}
          path: test-results
          retention-days: 7

  e2e:
    if: ${{ !inputs.native_export_repetitions || inputs.native_export_repetitions == '0' }}
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64

      - name: Install
        run: npm ci

      - name: Electron binary
        # Electron 45 downloads its binary on first use, not at npm ci; fetch
        # it here so the download never counts against a test timeout.
        timeout-minutes: 5
        run: node node_modules/electron/install.js

      - name: Build the app
        run: npm run build

      - name: Real-shell E2E (Playwright Electron, Linux under xvfb-run)
        shell: bash
        env:
          CI: "1"
          NO_AT_BRIDGE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: |
            artifacts/e2e
            playwright-report/e2e
            test-results/e2e
          if-no-files-found: warn
          retention-days: 7

  sheet:
    name: contact sheet
    needs: [e2e]
    if: ${{ always() && (!inputs.native_export_repetitions || inputs.native_export_repetitions == '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-*
          path: shots
      - run: node scripts/contact-sheet.mjs shots contact-sheet.html
      - uses: actions/upload-artifact@v7
        with:
          name: contact-sheet
          path: contact-sheet.html
          retention-days: 14

  native-export-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_export_repetitions != '0' }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Reproduce the Intel export journey
        env:
          CORTO_INCLUDE_QUARANTINED: "1"
          CORTO_EXPORT_DIAGNOSTIC: "1"
          CI: "1"
          CORTO_EXPORT_REPETITIONS: ${{ inputs.native_export_repetitions }}
        run: npx playwright test -c playwright.e2e.config.ts tests/e2e/essentials.spec.ts --repeat-each="$CORTO_EXPORT_REPETITIONS" --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-export-diagnostic
          path: |
            test-results/e2e
            playwright-report/e2e
          retention-days: 7
